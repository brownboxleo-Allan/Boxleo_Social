<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxleo Courier | Follow Us</title>
<style>
  :root {
    --bg1: #0f2a4a;
    --bg2: #1b4f8a;
    --card: #ffffff;
    --text: #12263f;
    --accent: #f5a623;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    color: #fff;
  }
  .wrap { width: 100%; max-width: 440px; text-align: center; }
  .logo {
    background: #fff; border-radius: 16px; padding: 14px 18px;
    margin: 0 auto 20px; max-width: 320px;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
  }
  .logo img { display: block; width: 100%; height: auto; }
  h1 { margin: 0 0 6px; font-size: 22px; line-height: 1.25; }
  p.tag { margin: 0 0 28px; opacity: .85; font-size: 15px; }
  a.link {
    display: flex; align-items: center; gap: 14px;
    background: var(--card); color: var(--text);
    text-decoration: none; font-weight: 600; font-size: 17px;
    padding: 14px 18px; margin-bottom: 14px; border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
    transition: transform .12s ease;
  }
  a.link:active, a.link:hover { transform: scale(1.02); }
  .dot {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 18px;
  }
  .label { flex: 1; text-align: left; }
  .arrow { opacity: .4; font-size: 20px; }
  footer { margin-top: 22px; font-size: 13px; opacity: .7; }
</style>
</head>
